[package]
name = "kalcode-desktop"
description = "KalCode desktop application shell (Tauri)."
# Keep equal to tauri.conf.json's public version (the updater User-Agent reads CARGO_PKG_VERSION).
# Only this crate carries it; the workspace crates stay at the fixed internal 0.0.0.
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "kalcode"

[lib]
name = "kalcode_desktop_lib"
# Desktop only: the `kalcode` binary links the rlib. The Tauri template's staticlib/cdylib exist for
# mobile builds (there is no mobile project); under release `lto = true` + `codegen-units = 1` the
# cdylib cost a second full fat-LTO link and the staticlib a whole-dependency archive on every
# release build. Add them back only when a mobile target exists.
crate-type = ["rlib"]

[[bin]]
name = "kalcode"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2.6", features = [] }

[dependencies]
kalcode-integrations = { path = "../../../crates/integrations" }
kalcode-integration-openai = { path = "../../../crates/integration-openai" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
kalcode-native-core = { path = "../../../crates/native-core" }
# Terminal output coalescing for the per-view channels (`kalcode_pty::OutputCoalescer`).
kalcode-pty = { path = "../../../crates/pty" }
kalcode-providers = { path = "../../../crates/providers" }
kalcode-secure-store = { path = "../../../crates/secure-store" }
kalcode-entitlements = { path = "../../../crates/entitlements" }
base64 = "=0.22.1"
png = "=0.18.1"
getrandom = "=0.3.4"
sha2 = "=0.10.9"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
kalcode-contracts = { path = "../../../crates/contracts" }
kalcode-threads = { path = "../../../crates/threads" }
kalcode-permissions = { path = "../../../crates/permissions" }
kalcode-kalvoice = { path = "../../../crates/kalvoice" }
tauri-plugin-global-shortcut = "2.3"
kalcode-hook-bridge = { path = "../../../crates/hook-bridge" }
kalcode-locator = { path = "../../../crates/locator" }
kalcode-git = { path = "../../../crates/git" }
kalcode-workspace-ui = { path = "../../../crates/workspace-ui" }
kalcode-notifications = { path = "../../../crates/notifications" }
kalcode-context = { path = "../../../crates/context" }
kalcode-resources = { path = "../../../crates/resources" }
kalcode-utilities = { path = "../../../crates/utilities" }
kalcode-doctor = { path = "../../../crates/doctor" }
tauri = { version = "2.11", features = ["unstable"] }
tauri-plugin-opener = "2.5"
kalcode-updater = { path = "../../../crates/updater" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
semver = "1"
url = "2"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4"
serde.workspace = true
serde_json.workspace = true
# KalVoice "what was I working on yesterday" (Z7-W2): the local calendar day.
time = { workspace = true, features = ["local-offset"] }
tracing.workspace = true
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"
# Live Browser screenshots (WebView2 CapturePreview into an in-memory stream).
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

# libproc bindings for the KalVoice loopback owner proof (kalvoice_guardian.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
# Live Browser screenshots (WKWebView takeSnapshot, exported as PNG).
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[dev-dependencies]
tempfile.workspace = true
ed25519-dalek = "2"

# tests/windows_tao_reentrant_focus.rs drives the patched tao (third_party/tao) directly.
[target.'cfg(windows)'.dev-dependencies]
tao = "0.35"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

[features]
# Keeps test hooks (WebView2 debugging variables, KALCODE_DATA_DIR) in release builds.
# Used only to build the binary the end-to-end suite drives; never for shipped installers.
e2e = ["kalcode-secure-store/test-support"]
# On-device speech recognition (whisper.cpp). Needs libclang at build time: install LLVM and set
# LIBCLANG_PATH (docs/KALVOICE.md, "Building"). Without it, dictation shows that the speech
# engine isn't included in this build.
kalvoice-whisper = ["kalcode-kalvoice/whisper"]
