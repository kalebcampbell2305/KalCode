[package]
name = "kalcode-desktop"
description = "KalCode desktop application shell (Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kalcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kalcode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
kalcode-native-core = { path = "../../../crates/native-core" }
kalcode-secure-store = { path = "../../../crates/secure-store" }
kalcode-contracts = { path = "../../../crates/contracts" }
kalcode-kalvoice = { path = "../../../crates/kalvoice" }
tauri-plugin-global-shortcut = "2.3"
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true

[features]
# Keeps test hooks (WebView2 debugging variables, KALCODE_DATA_DIR) in release builds.
# Used only to build the binary the end-to-end suite drives; never for shipped installers.
e2e = []
# On-device speech recognition (whisper.cpp). Needs libclang at build time: install LLVM and set
# LIBCLANG_PATH (docs/KALVOICE.md, "Building"). Without it, dictation shows that the speech
# engine isn't included in this build.
kalvoice-whisper = ["kalcode-kalvoice/whisper"]
