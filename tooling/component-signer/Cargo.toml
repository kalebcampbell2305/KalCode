[package]
name = "kalcode-component-signer"
version = "0.1.0"
edition = "2024"
publish = false

# Release-only, purpose-limited signing helper. It remains outside the product workspace so the
# component private key can never become a desktop runtime capability.
[workspace]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
