[package]
name = "kalcode-updater-signer"
version = "0.1.0"
edition = "2024"
publish = false

# This release-only helper has an independent lockfile. It is deliberately outside the product
# workspace so updater private-key custody cannot become a desktop runtime capability.
[workspace]

[dependencies]
base64 = "0.22"
minisign = "0.9.1"
semver = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
