[package]
name = "kalcode-native-core"
description = "KalCode native runtime core: persistence, migrations, event protocol, settings, errors, logging, workspaces and terminals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kalcode_core"

[dependencies]
kalcode-pty = { path = "../pty" }
kalcode-contracts = { path = "../contracts" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
rusqlite = { workspace = true, features = ["bundled", "backup"] }
sha2 = "0.10"
same-file = "1"
regex = "1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"
os_info = { version = "3", default-features = false }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
