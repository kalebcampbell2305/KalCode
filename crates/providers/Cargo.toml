[package]
name = "kalcode-providers"
description = "KalCode provider runtime: detection, capabilities, permission mapping, process supervision and provider adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kalcode_providers"

# Required production crash-isolation helper. The release pipeline builds, signs, and installs it
# beside the desktop executable; GuardianRuntime resolves that fixed sibling path.
[[bin]]
name = "kalcode-provider-guardian"
path = "src/bin/kalcode-provider-guardian.rs"
test = false
doc = false

# Test support only: a stand-in provider CLI that replays documented stream-JSON fixtures so the
# spawn -> parse -> event pipeline is tested without running a real provider (no AI quota used).
# It is not part of the desktop bundle.
[[bin]]
name = "kalcode-fake-provider"
path = "src/bin/fake_provider.rs"
test = false
doc = false

[dependencies]
kalcode-secure-store = { path = "../secure-store" }
kalcode-contracts = { path = "../contracts" }
kalcode-native-core = { path = "../native-core" }
kalcode-pty = { path = "../pty" }
kalcode-hook-bridge = { path = "../hook-bridge" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
same-file = "1"
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
uuid = { workspace = true, features = ["v4"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Provider panes through the whole stack (tests/interactive_runtime.rs). Neither depends on
# this crate, so there is no cycle.
kalcode-threads = { path = "../threads" }
kalcode-permissions = { path = "../permissions" }

[lints]
workspace = true
