[package]
name = "kalcode-providers"
description = "KalCode provider runtime: detection, capabilities, permission mapping, process supervision and provider adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kalcode_providers"

# Test support only: a stand-in provider CLI that replays documented stream-JSON fixtures so the
# spawn -> parse -> event pipeline is tested without running a real provider (no AI quota used).
# It is not part of the desktop bundle.
[[bin]]
name = "kalcode-fake-provider"
path = "src/bin/fake_provider.rs"
test = false
doc = false

[dependencies]
kalcode-contracts = { path = "../contracts" }
kalcode-native-core = { path = "../native-core" }
kalcode-pty = { path = "../pty" }
kalcode-hook-bridge = { path = "../hook-bridge" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
uuid = { workspace = true, features = ["v4"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }

[dev-dependencies]
tempfile.workspace = true
# Provider panes through the whole stack (tests/interactive_runtime.rs). Neither depends on
# this crate, so there is no cycle.
kalcode-threads = { path = "../threads" }
kalcode-permissions = { path = "../permissions" }

[lints]
workspace = true
