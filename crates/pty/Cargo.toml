[package]
name = "kalcode-pty"
description = "KalCode terminal sessions: native pseudo-terminals with scrollback, input, resize and exit tracking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kalcode_pty"

[dependencies]
portable-pty = "0.9"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[lints]
workspace = true
