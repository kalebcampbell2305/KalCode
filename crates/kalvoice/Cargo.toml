[package]
name = "kalcode-kalvoice"
description = "KalVoice: command grammar, usage ledger, request orchestration, on-device speech (capture, recognition, model management) and optional OS speech output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kalcode_kalvoice"

[features]
default = []
# whisper.cpp speech recognition (whisper-rs). Its build generates bindings with bindgen, which
# needs libclang: install LLVM and set LIBCLANG_PATH (docs/KALVOICE.md, "Building").
whisper = ["dep:whisper-rs"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
fs2 = "0.4"
url = "2"
kalcode-contracts = { path = "../contracts" }
kalcode-native-core = { path = "../native-core" }
kalcode-secure-store = { path = "../secure-store" }
kalcode-permissions = { path = "../permissions" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
rusqlite.workspace = true
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid.workspace = true
whisper-rs = { version = "0.16", optional = true }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

# Microphone capture and OS speech output use native audio stacks. Linux needs ALSA and
# speech-dispatcher development packages, which this repository's CI does not install yet, so
# on Linux both report themselves unavailable instead.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18"
tts = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioApplication", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[example]]
name = "stt_probe"
required-features = ["whisper"]

[[example]]
name = "mic_probe"

[[example]]
name = "latency_bench"
required-features = ["whisper"]
