[package]
name = "kalcode-kalvoice"
description = "KalVoice: command grammar, usage ledger, request orchestration, on-device speech (capture, recognition, model management) and optional OS speech output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kalcode_kalvoice"

[features]
default = []
# whisper.cpp speech recognition (whisper-rs). Its build generates bindings with bindgen, which
# needs libclang: install LLVM and set LIBCLANG_PATH (docs/KALVOICE.md, "Building").
whisper = ["dep:whisper-rs"]

[dependencies]
kalcode-contracts = { path = "../contracts" }
kalcode-native-core = { path = "../native-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
rusqlite.workspace = true
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
whisper-rs = { version = "0.16", optional = true }

# Microphone capture and OS speech output use native audio stacks. Linux needs ALSA and
# speech-dispatcher development packages, which this repository's CI does not install yet, so
# on Linux both report themselves unavailable instead.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18"
tts = { version = "0.26", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
