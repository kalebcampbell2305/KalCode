name: PC2 extra gate runners bootstrap (throwaway)

# Throwaway branch only (never merged). The kalcode-qa account (runners 2c/2d) gets the build PC's gate tools
# (cargo-deny 0.20.2, cargo-audit 0.22.2; rustc is pinned to 1.97.1 by RUSTUP_TOOLCHAIN in their .env), and we
# verify the owner's lock-folder grant lets it open the gate locks read-write.

on:
  push:
    branches: ["ops/pc2-probe"]

permissions:
  contents: read

jobs:
  qa-account:
    runs-on: [self-hosted, Windows, kalcode-desktop-qa]
    timeout-minutes: 15
    steps:
      - name: Tools and lock access for kalcode-qa
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          "account $env:USERNAME"
          $bin = Join-Path $env:USERPROFILE '.cargo\bin'
          $env:PATH = "$bin;$env:PATH"
          $tmp = Join-Path $env:RUNNER_TEMP 'tools'; New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $deny = 'https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz'
          Invoke-WebRequest -UseBasicParsing -Uri $deny -OutFile "$tmp\deny.tar.gz"
          Invoke-WebRequest -UseBasicParsing -Uri "$deny.sha256" -OutFile "$tmp\deny.sha256"
          $want = ((Get-Content -Raw -LiteralPath "$tmp\deny.sha256").Trim() -split '\s+')[0].ToLower()
          $got = (Get-FileHash -Algorithm SHA256 "$tmp\deny.tar.gz").Hash.ToLower()
          if ($want -ne $got) { throw "cargo-deny sha256 mismatch $got vs $want" }
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -xzf "$tmp\deny.tar.gz" -C $tmp; if ($LASTEXITCODE) { throw 'untar cargo-deny failed' }
          Copy-Item -Force (Get-ChildItem -Recurse -LiteralPath $tmp -Filter 'cargo-deny.exe' | Select-Object -First 1).FullName (Join-Path $bin 'cargo-deny.exe')
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-pc-windows-msvc-v0.22.2.zip' -OutFile "$tmp\audit.zip"
          Expand-Archive -Force -LiteralPath "$tmp\audit.zip" -DestinationPath "$tmp\audit"
          Copy-Item -Force (Get-ChildItem -Recurse -LiteralPath "$tmp\audit" -Filter 'cargo-audit.exe' | Select-Object -First 1).FullName (Join-Path $bin 'cargo-audit.exe')
          foreach ($x in '2c', '2d') { "$x .env: " + ((Get-Content -LiteralPath "C:\kalcode-ci-$x\runner\.env") -join ' | ') }
          $env:RUSTUP_TOOLCHAIN = '1.97.1'
          $v = @((& rustc --version), (& cargo clippy --version), (& cargo deny --version), (& cargo audit --version)) | ForEach-Object { "$_".Trim() }
          "VERIFY kalcode-qa (as 2c/2d see it): $($v -join ' / ')"
          if ($v[0] -notmatch '^rustc 1\.97\.1 ' -or $v[1] -notmatch '^clippy 0\.1\.97' -or $v[2] -notmatch '^cargo-deny 0\.20\.2' -or $v[3] -notmatch '0\.22\.2') { throw "version check failed" }
          "== lock folder ACL"; & icacls.exe 'C:\ProgramData\KalCodePC2\locks' | Select-String 'kalcode-qa'
          $bad = 0
          foreach ($n in 'browser.lock', 'rust.lock', 'gate.lock', 'qa-intent.lock') {
            $f = "C:\ProgramData\KalCodePC2\locks\$n"
            try { $h = [IO.File]::Open($f, 'OpenOrCreate', 'ReadWrite', 'ReadWrite'); $h.Dispose(); "LOCK $n read-write OK" }
            catch { if ($_.Exception.Message -match 'being used') { "LOCK $n in use (access OK)" } else { "LOCK $n FAILED: $($_.Exception.Message)"; $bad++ } }
          }
          if ($bad) { throw "$bad lock file(s) not writable by kalcode-qa" }
