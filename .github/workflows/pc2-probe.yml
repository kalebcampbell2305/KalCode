name: PC2 extra gate runners bootstrap (throwaway)

# Throwaway branch only (never merged). Registers kalcode-win-gate-2c and -2d on the second PC as extra
# runner instances of this gate account, outside any runner's _work tree, with the holding label
# kalcode-gate-pc2-pending (activated only once gate.yml on main accepts their names, #382). They run
# detached until the next reboot; the owner's one-time elevated add-gate-runner-pc2.ps1 makes them services.

on:
  push:
    branches: ["ops/pc2-probe"]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, kalcode-gate-pc2]
    timeout-minutes: 20
    steps:
      - name: Register and start kalcode-win-gate-2c and -2d
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          REG_TOKEN: ${{ secrets.PC2_RUNNER_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:REG_TOKEN) { throw 'No registration token secret' }
          # RUNNER_WORKSPACE = <runner>\_work\<repo>; the runner's own folder holds bin\, externals\ and .env.
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_WORKSPACE)
          $accountRoot = Split-Path -Parent $runnerRoot
          "Host runner $env:RUNNER_NAME as $env:USERNAME; runner root $runnerRoot; account root $accountRoot"
          if (-not (Test-Path -LiteralPath (Join-Path $runnerRoot 'config.cmd'))) { throw "No runner install at $runnerRoot" }
          foreach ($name in 'kalcode-win-gate-2c', 'kalcode-win-gate-2d') {
            $dir = Join-Path $accountRoot ('runner-' + ($name -replace '^kalcode-win-gate-', ''))
            if (-not (Test-Path -LiteralPath (Join-Path $dir '.runner'))) {
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              & robocopy.exe $runnerRoot $dir /E /NFL /NDL /NJH /NJS /NP /XD _work _diag /XF .runner .credentials .credentials_rsaparams .service | Out-Null
              if ($LASTEXITCODE -ge 8) { throw "copy failed for $name ($LASTEXITCODE)" }
              Push-Location $dir
              try {
                & .\config.cmd --unattended --replace --url https://github.com/kalebcampbell2305/KalCode --token $env:REG_TOKEN --name $name --labels kalcode-gate-pc2-pending --work _work
                if ($LASTEXITCODE) { throw "config failed for $name ($LASTEXITCODE)" }
              } finally { Pop-Location }
            }
            $running = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) })
            if ($running.Count -gt 0) { "$name already running (pid $($running[0].ProcessId))"; continue }
            # Outlive this job: the runner stops a job's leftovers by its tracking id; give the child none.
            $env:RUNNER_TRACKING_ID = '0'
            Start-Process -FilePath (Join-Path $dir 'run.cmd') -WorkingDirectory $dir -WindowStyle Hidden
            Start-Sleep -Seconds 10
            $started = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) })
            "$name started: $($started.Count) listener(s) in $dir"
          }
