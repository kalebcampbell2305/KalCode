name: PC2 extra gate runners bootstrap (throwaway)

# Throwaway branch only (never merged). Diagnose and, where this account may, fix kalcode-qa's access to the
# second PC's gate lock folder (2c/2d run as kalcode-qa; browser.lock access was denied in gate 37710308604).

on:
  push:
    branches: ["ops/pc2-probe"]

permissions:
  contents: read

jobs:
  locks:
    runs-on: [self-hosted, Windows, kalcode-desktop-qa]
    timeout-minutes: 10
    steps:
      - name: Lock folder access for kalcode-qa
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          "whoami: $(whoami)"
          $dir = 'C:\ProgramData\KalCodePC2\locks'
          foreach ($p in @('C:\ProgramData\KalCodePC2', $dir)) { "== $p"; & icacls.exe $p }
          $files = @(Get-ChildItem -Force -LiteralPath $dir -File -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            $owner = (Get-Acl -LiteralPath $f.FullName).Owner
            $ok = $false
            try { $h = [IO.File]::Open($f.FullName, 'OpenOrCreate', 'ReadWrite', 'ReadWrite'); $h.Dispose(); $ok = $true } catch { $err = $_.Exception.Message }
            "file $($f.Name) owner=$owner openReadWrite=$ok $(if (-not $ok) { $err })"
          }
          "== try granting kalcode-qa Modify (dir, inherit) and on each file"
          & icacls.exe $dir /grant 'kalcode-qa:(OI)(CI)M' 2>&1 | ForEach-Object { "  dir: $_" }
          foreach ($f in $files) { & icacls.exe $f.FullName /grant 'kalcode-qa:M' 2>&1 | ForEach-Object { "  $($f.Name): $_" } }
          "== after"
          foreach ($f in $files) {
            $ok = $false
            try { $h = [IO.File]::Open($f.FullName, 'OpenOrCreate', 'ReadWrite', 'ReadWrite'); $h.Dispose(); $ok = $true } catch { }
            "file $($f.Name) openReadWrite=$ok"
          }
          # Machine lock (gate.lock) is opened shared for read by gate jobs; check that mode too.
          foreach ($n in 'gate.lock', 'qa-intent.lock', 'browser.lock', 'rust.lock') {
            $p = Join-Path $dir $n
            try { $h = [IO.File]::Open($p, 'OpenOrCreate', 'Read', 'Read'); $h.Dispose(); "$n read-open OK" } catch { "$n read-open FAILED: $($_.Exception.Message)" }
          }
          exit 0
