name: Gate (self-hosted)

# The repository's gate (`ship.mjs gate`) on KalCode's own machines, so merging never depends on
# GitHub-hosted minutes. The runners are the low-privilege gate accounts described in
# tooling/runners/README.md: they hold no signing, publishing or GitHub credentials.

on:
  push:
    # Gate the exact immutable candidate before the train updates main. main itself is not gated on
    # push: it only ever moves to a commit that already passed this gate (the train lands the exact
    # gated candidate), so a push gate on main would re-run the same evidence and hold both PCs.
    branches: ["merge-train/**"]
  pull_request:
    # Docs-only PRs skip the self-hosted gate. Later patterns win; release notes still gate.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!marketing/**"
      - "docs/releases/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Gate base commit (a manual trial gates every check this range touches); default origin/main~1"
        required: false
        default: ""

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Each physical worker assigns isolated ports below. Bound nested check fan-out.
  # One check at a time per job: every gate job runs on PC2, a laptop, three jobs at once (2026-10-08:
  # two checks per job, six heavy processes, timed out desktop-unit, website-unit and api-unit hooks).
  KALCODE_GATE_JOBS: "1"
  # Rust compiles need real parallelism: one Rust gate at a time per gate PC (rust.lock) at below-normal
  # priority; a cold first build still fits in 8 jobs (2 jobs could not, gate 37345525181).
  CARGO_BUILD_JOBS: "8"
  VITEST_MAX_WORKERS: "2"
  KALCODE_UI_TEST_WORKERS: "2"

jobs:
  windows:
    # Owner, 2026-10-07: every gate runs on the second Windows PC (KALEBSLAPTOP), which nothing else uses;
    # the build PC only builds and ships (its owner-requested agents starved gates there). These are two
    # jobs so their chains overlap on that PC's two gate runners: "Gate (Windows)" (the desktop
    # frontend/UI readers and any new check) and "Gate (Windows, native)" (rust, native E2E and the Cargo
    # tools, which write the checkout). The "Gate (Windows, PC2)" job below runs the JS/web share. All
    # three jobs test the same event SHA; tooling/release/lifecycle/gate-split.mjs assigns the checks.
    name: ${{ matrix.half == 'native' && 'Gate (Windows, native)' || 'Gate (Windows)' }}
    strategy:
      # One half failing never cancels the other: each half's own result is evidence.
      fail-fast: false
      matrix:
        half: [main, native]
    # Never run code from a fork on our machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, kalcode-gate-pc2]
    # A cold first Rust build on the second PC's runners fits; warm runs take a fraction.
    timeout-minutes: 300
    steps:
      # A merge-train landing fast-forwards main to a candidate this job already gated. Re-gating the
      # identical commit would only occupy the gate runner, so reuse that evidence. Runs before checkout:
      # no code under test sees the token.
      - name: Reuse the merge-train gate of this exact commit
        id: reuse
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/website-'))
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          # The release kit's website-record PR (release/website-*) changes only the release record and
          # release notes, the paths the train treats as evidence-preserving (merge-train/train.mjs
          # isReleaseRecordPath). The kit gates it itself before merging (exact diff set, check:releases,
          # website typecheck/unit/build/e2e), so gating it here only held pool workers lanes needed. A PR
          # that changes, renames or removes anything else gates as usual.
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $record = { param($path) $path -eq 'apps/website/src/data/releases.json' -or ($path -is [string] -and $path.StartsWith('docs/releases/')) }
            try {
              $files = @(); $page = 1
              do {
                $batch = @(Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER/files?per_page=100&page=$page")
                $files += $batch; $page++
              } while ($batch.Count -eq 100 -and $page -le 30)
              $other = @($files | Where-Object { -not (& $record $_.filename) -or ($_.previous_filename -and -not (& $record $_.previous_filename)) })
              if ($files.Count -gt 0 -and $other.Count -eq 0) {
                Write-Output "Release-record PR #$($env:PR_NUMBER): only the release record and notes changed; the release kit gates it."
                Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii -Value 'reused=true'
              }
            } catch {
              Write-Output "::warning::Could not list the PR's files ($($_.Exception.Message)); gating."
            }
            exit 0
          }
          # A trusted gate host: one of the second PC's gate runners (owner, 2026-10-07: all gates there), or a
          # build-PC pool worker for a candidate gated before that move.
          $gateHost = {
            param($j)
            ($j.labels -contains 'self-hosted') -and ($j.labels -contains 'Windows') -and (
              ($j.runner_name -in @('kalcode-win-gate-2', 'kalcode-win-gate-2b') -and ($j.labels -contains 'kalcode-gate-pc2') -and -not ($j.labels -contains 'kalcode-main-pc')) -or
              ($j.runner_name -match '^kalcode-win-gate(-w[1-5])?$' -and ($j.labels -contains 'kalcode-gate') -and ($j.labels -contains 'kalcode-main-pc')))
          }
          try {
            $runs = (Invoke-RestMethod -Headers $headers -Uri "$api/workflows/gate.yml/runs?head_sha=$env:GITHUB_SHA&per_page=20").workflow_runs
            foreach ($run in $runs) {
              if ($run.id -eq [long]$env:GITHUB_RUN_ID -or $run.head_sha -ne $env:GITHUB_SHA -or $run.event -ne 'push' -or
                  $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/gate.yml' -or $run.head_branch -notmatch '^merge-train/[0-9a-f]{12}-[0-9a-f]{8}$') { continue }
              $jobs = (Invoke-RestMethod -Headers $headers -Uri "$api/runs/$($run.id)/jobs?filter=latest&per_page=100").jobs
              # The same evidence the train lands on: a trusted gate host whose Gate step itself ran and passed.
              $green = $jobs | Where-Object {
                $_.name -eq 'Gate (Windows)' -and $_.conclusion -eq 'success' -and $_.head_sha -eq $env:GITHUB_SHA -and
                (& $gateHost $_) -and
                ($_.steps | Where-Object { $_.name -eq 'Gate' -and $_.conclusion -eq 'success' })
              }
              # A split gate also needs the second PC's job green on the same SHA; a legacy run has none.
              $pc2 = @($jobs | Where-Object { $_.name -eq 'Gate (Windows, PC2)' })
              $pc2Green = $pc2.Count -eq 0 -or @($pc2 | Where-Object {
                $_.conclusion -eq 'success' -and $_.head_sha -eq $env:GITHUB_SHA -and $_.runner_name -in @('kalcode-win-gate-2', 'kalcode-win-gate-2b') -and
                ($_.labels -contains 'self-hosted') -and ($_.labels -contains 'Windows') -and ($_.labels -contains 'kalcode-gate-pc2') -and
                -not ($_.labels -contains 'kalcode-main-pc') -and
                ($_.steps | Where-Object { $_.name -eq 'Gate' -and $_.conclusion -eq 'success' })
              }).Count -eq 1
              # A two-job Windows gate also needs its native job green on the same SHA on a trusted gate host.
              $native = @($jobs | Where-Object { $_.name -eq 'Gate (Windows, native)' })
              $nativeGreen = $native.Count -eq 0 -or @($native | Where-Object {
                $_.conclusion -eq 'success' -and $_.head_sha -eq $env:GITHUB_SHA -and
                (& $gateHost $_) -and
                ($_.steps | Where-Object { $_.name -eq 'Gate' -and $_.conclusion -eq 'success' })
              }).Count -eq 1
              if ($green -and $pc2Green -and $nativeGreen) {
                Write-Output "Gate (Windows) already passed for $env:GITHUB_SHA on $($run.head_branch): $($run.html_url)"
                # ASCII: Windows PowerShell's utf8 writes a BOM into an empty file, which corrupts the key.
                Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii -Value 'reused=true'
                exit 0
              }
            }
          } catch {
            Write-Output "::warning::Could not look up merge-train gate evidence ($($_.Exception.Message)); gating."
          }
      # A cancelled or killed earlier job can leave test binaries/rustc running under this worker's
      # _work directory, holding DLLs in the warm target (gate 37362947496 then failed in checkout).
      # Inline because the repository is not checked out yet; same rule as
      # .github/scripts/gate-workspace-hygiene.ps1 -Phase Stop. Own-account processes only.
      - name: Stop this worker's orphaned processes
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $root = ([IO.Path]::GetFullPath((Split-Path -Parent $env:RUNNER_WORKSPACE))).TrimEnd('\') + '\'
          if ($root -notmatch '\\_work\\$') { throw "Refusing to clean outside a runner _work directory: $root" }
          $all = @(Get-CimInstance Win32_Process); $byId = @{}; foreach ($p in $all) { $byId[[int]$p.ProcessId] = $p }
          $keep = @{}; $c = $byId[[int]$PID]; for ($i = 0; $i -lt 16 -and $null -ne $c; $i++) { $keep[[int]$c.ProcessId] = $true; $c = $byId[[int]$c.ParentProcessId] }
          foreach ($p in $all) {
            if ($keep.ContainsKey([int]$p.ProcessId) -or $p.Name -match '^(Runner\.(Worker|Listener)|RunnerService)\.exe$' -or -not $p.ExecutablePath) { continue }
            $cmd = [string]$p.CommandLine
            if ($p.ExecutablePath.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) -or ($cmd -and $cmd.IndexOf($root.TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase) -ge 0)) {
              Write-Output "Stopping orphan $($p.ProcessId) $($p.Name)"; & taskkill.exe /T /F /PID $p.ProcessId 2>&1 | Out-Null
            }
          }
          exit 0
      # The gate PC must not throttle or sleep mid-gate (owner, 2026-10-07: PC2 stays plugged in and idle for
      # gates). Evidence only: it warns and never fails the job.
      - name: Record the gate PC's power state
        if: steps.reuse.outputs.reused != 'true' && matrix.half == 'main'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $scheme = (powercfg /getactivescheme | Out-String).Trim()
          Write-Output "Power plan: $scheme"
          if ($scheme -notmatch '8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c|High performance|Ultimate') { Write-Output '::warning::The gate PC is not on the High Performance power plan.' }
          foreach ($setting in @('STANDBYIDLE', 'HIBERNATEIDLE')) {
            $q = (powercfg /q SCHEME_CURRENT SUB_SLEEP $setting | Out-String)
            $ac = [regex]::Match($q, 'Current AC Power Setting Index:\s+0x([0-9a-f]+)').Groups[1].Value
            $seconds = if ($ac) { [Convert]::ToInt64($ac, 16) } else { -1 }
            Write-Output "$setting on AC: $(if ($seconds -eq 0) { 'never' } elseif ($seconds -lt 0) { 'unknown' } else { "$seconds s" })"
            if ($seconds -gt 0) { Write-Output "::warning::The gate PC $setting on AC is $seconds s; set it to never." }
          }
          try {
            $battery = Get-CimInstance Win32_Battery -ErrorAction Stop | Select-Object -First 1
            if ($battery) { Write-Output "Battery: $($battery.EstimatedChargeRemaining)% status $($battery.BatteryStatus) (2 = on AC)" }
          } catch { }
          $receipt = Get-ChildItem -Path 'C:\kalcode-ci\pc2-tuning-*.json' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($receipt) { Write-Output "Tuning receipt $($receipt.Name):"; Get-Content -LiteralPath $receipt.FullName -ErrorAction SilentlyContinue | Select-Object -First 40 }
          else { Write-Output 'No tune-gate-pc2 receipt is readable from this runner account.' }
          exit 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          fetch-depth: 0
          # Leave no GitHub token in the checkout for the code under test.
          persist-credentials: false
          # The default clean (git clean -ffdx) wipes the worker's warm Cargo target and fails on files a
          # leftover process holds; the next step resets to the exact SHA and cleans everything else.
          clean: false
      - name: Reset to the exact event SHA, keeping warm caches
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/gate-workspace-hygiene.ps1 -Phase Reset
      - name: Plan change-based gate
        if: steps.reuse.outputs.reused != 'true'
        id: plan
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || inputs.base || 'origin/main~1' }}
          GATE_HALF: ${{ matrix.half }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GATE_HALF -notin @('main', 'native')) { throw "Unknown Windows gate half: $env:GATE_HALF" }
          # The second PC's two gate runners each have a fixed port block (slot 1 adds 20), shared with the
          # PC2 job below: a runner runs one job at a time.
          $pc2Slot = switch ($env:RUNNER_NAME) { 'kalcode-win-gate-2' { 0 } 'kalcode-win-gate-2b' { 1 } default { throw 'Unknown second-PC gate worker' } }
          $portOffset = 20 * $pc2Slot
          $head = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -or $head -ne $env:GITHUB_SHA) { throw 'Checkout does not match the immutable event SHA' }
          $base = $env:BASE
          if ($env:GITHUB_REF -like 'refs/heads/merge-train/*') {
            if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF -notmatch '^refs/heads/merge-train/[0-9a-f]{12}-[0-9a-f]{8}$') {
              throw 'Merge-train evidence requires an exact candidate branch push'
            }
            $base = (git log -1 --format='%(trailers:key=Merge-Train-Base,valueonly)' HEAD | Out-String).Trim()
            if ($LASTEXITCODE -or $base -notmatch '^[0-9a-f]{40}$' -or $base -eq $head) {
              throw 'Merge-train candidate has no distinct immutable Merge-Train-Base trailer'
            }
          }
          $base = (git rev-parse --verify "$base^{commit}" | Out-String).Trim()
          if ($LASTEXITCODE -or $base -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve immutable gate base' }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE) { throw 'Gate base is not an ancestor of the candidate' }
          $json = node tooling/release/ship.mjs gate --base $base --list --json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $plan = ($json | Out-String | ConvertFrom-Json).plan
          $selected = @($plan | Where-Object { $_.state -eq 'selected' } | ForEach-Object { $_.id })
          # This job's share of the plan (tooling/release/lifecycle/gate-split.mjs): the "main" or "native"
          # half; the other half and the PC2 job run the rest.
          $only = (node tooling/release/lifecycle/gate-split.mjs $env:GATE_HALF ($selected -join ',') | Out-String).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ids = @($only -split ',' | Where-Object { $_ })
          @(
            "KALCODE_GATE_BASE=$base", "KALCODE_GATE_ONLY=$only", "KALCODE_GATE_HEAVY=$($ids -contains 'rust' -or $ids -contains 'desktop-native-e2e')",
            "KALCODE_E2E_PORT=$(4691 + $portOffset)", "KALCODE_E2E_MAIL_PORT=$(4692 + $portOffset)",
            "KALCODE_E2E_INSPECTOR_PORT=$(9701 + $portOffset)", "KALCODE_UI_TEST_PORT=$(1791 + $portOffset)",
            "KALCODE_E2E_CDP_PORT=$(39333 + $portOffset)",
            # desktop-ui and desktop-native-e2e never overlap across this PC's jobs (machine-lock.mjs), in the
            # folder every PC2 runner account can write (tooling/runners/windows/add-gate-runner-pc2.ps1).
            'KALCODE_GATE_LOCK_DIR=C:\ProgramData\KalCodePC2\locks'
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding ascii
          "python=$(([string]($ids -contains 'tooling-unit' -or $ids -contains 'desktop-native-e2e')).ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii
          "native=$(([string]($ids -contains 'desktop-native-e2e')).ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii
          "browsers=$(([string](@($ids | Where-Object { $_ -in @('desktop-ui','desktop-native-e2e','website-e2e','website-checkout-e2e') }).Count -gt 0)).ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii
          Write-Host "Exact candidate $head; base $base; selected checks: $($selected -join ', '); in this $env:GATE_HALF job: $($ids -join ', ')"
      - name: Install
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install selected browser runtime
        if: steps.reuse.outputs.reused != 'true' && (steps.plan.outputs.browsers == 'true')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          pnpm --filter @kalcode/desktop exec playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # tooling-unit runs the desktop package proof's real SQLite comparison through `python`.
      # The gate machine has no system Python, so use the same pinned, signature-checked
      # portable runtime the desktop QA workflows use, scoped to this run.
      - name: Prepare portable Python
        id: python
        if: steps.reuse.outputs.reused != 'true' && (steps.plan.outputs.python == 'true')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-desktop-python.ps1
      # build:e2e compiles kalvoice-whisper: whisper-rs-sys needs CMake and libclang (bindgen),
      # which the gate machine lacks. Pinned, hash-checked official archives, scoped to this run.
      - name: Prepare portable CMake and libclang
        id: native
        if: steps.reuse.outputs.reused != 'true' && (steps.plan.outputs.native == 'true')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-portable-cmake.ps1
      - name: Gate
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        # Release tooling expects Cargo's default target/ (checkout-local; the runner keeps it).
        run: |
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          $head = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -or $head -ne $env:GITHUB_SHA) { throw "Checkout does not match the immutable event SHA" }
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          if (-not $env:KALCODE_GATE_ONLY) { Write-Host 'gate: nothing selected for this job (the other jobs run the rest)'; exit 0 }
          $token = $null
          $lock = $null
          try {
            if ($env:KALCODE_GATE_HEAVY -eq 'True') {
              # One Rust gate at a time on this PC (two cold Rust builds would exhaust it). Process exit
              # releases the handle, so a killed job never leaves it held.
              $rust = 'C:\ProgramData\KalCodePC2\locks\rust.lock'
              $deadline = (Get-Date).AddMinutes(120)
              while ($null -eq $token) {
                try {
                  $token = [IO.File]::Open($rust, 'OpenOrCreate', 'ReadWrite', 'None')
                } catch [System.UnauthorizedAccessException] {
                  Write-Host "::warning::No access to $rust; running without the Rust slot."
                  break
                } catch [System.IO.DirectoryNotFoundException] {
                  Write-Host "::warning::The second PC's lock folder is missing; running without the Rust slot."
                  break
                } catch [System.IO.IOException] {
                  if ((Get-Date) -ge $deadline) { throw 'Another Rust gate held this PC for 120 minutes; retry when it finishes' }
                  Write-Host 'Waiting for the other Rust gate on this PC'
                  Start-Sleep -Seconds 15
                }
              }
            }
            # Shared with this PC's other gate runner; never alongside its Windows update proof, which has priority.
            . .github/scripts/pc2-machine-lock.ps1
            $lock = Enter-Pc2MachineLock -Mode Shared -TimeoutMinutes 60
            node tooling/release/ship.mjs gate --base $env:KALCODE_GATE_BASE --only $env:KALCODE_GATE_ONLY --jobs $env:KALCODE_GATE_JOBS --keep-going
            $code = $LASTEXITCODE
          } finally {
            if ($null -ne $lock) { Exit-Pc2MachineLock $lock }
            if ($null -ne $token) { $token.Dispose() }
          }
          if ($code) { exit $code }
      # A failed Playwright suite keeps its traces and DOM snapshots (retain-on-failure) for diagnosis,
      # on failure only and only while they stay small.
      - name: Measure Playwright failure evidence
        id: playwright_evidence
        if: steps.reuse.outputs.reused != 'true' && failure()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $files = @('apps/desktop/test-results', 'packages/ui/test-results') | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -ErrorAction SilentlyContinue }
          $bytes = [long]($files | Measure-Object -Property Length -Sum).Sum
          $limit = 200MB
          if ($bytes -gt $limit) { Write-Warning "Playwright failure evidence is $([math]::Round($bytes / 1MB)) MB, over the $($limit / 1MB) MB bound; not uploaded" }
          "keep=$(($bytes -gt 0 -and $bytes -le $limit).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Preserve Playwright failure evidence
        if: steps.reuse.outputs.reused != 'true' && failure() && steps.playwright_evidence.outputs.keep == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-playwright-${{ matrix.half == 'native' && 'native-' || '' }}${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results/
            packages/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove this run's portable Python
        if: steps.reuse.outputs.reused != 'true' && (always() && steps.python.outcome != 'skipped' && steps.python.outcome != '')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-desktop-python.ps1 -Cleanup
      - name: Remove this run's portable CMake and libclang
        if: steps.reuse.outputs.reused != 'true' && (always() && steps.native.outcome != 'skipped' && steps.native.outcome != '')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-portable-cmake.ps1 -Cleanup
      - name: Preserve exact candidate evidence
        if: steps.reuse.outputs.reused != 'true' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-evidence-${{ matrix.half == 'native' && 'native-' || '' }}${{ github.sha }}-${{ github.run_attempt }}
          path: target/gate-evidence.json
          if-no-files-found: ignore
      # Nothing this job started may outlive it and hold the warm target open for the next job.
      - name: Stop processes this job left behind
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path -LiteralPath '.github/scripts/gate-workspace-hygiene.ps1') { .github/scripts/gate-workspace-hygiene.ps1 -Phase Stop }


  pc2:
    name: Gate (Windows, PC2)
    # Never run code from a fork on our machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The JS/web share of the same exact candidate, on the second Windows PC like the jobs above (owner,
    # 2026-10-07: all gates there). Its runners are kalcode-win-gate-2 and kalcode-win-gate-2b, each with
    # its own account, checkout and port block.
    runs-on: [self-hosted, Windows, kalcode-gate-pc2]
    timeout-minutes: 120
    steps:
      # A merge-train landing fast-forwards main to a candidate this job already gated. Re-gating the
      # identical commit would only occupy the gate runner, so reuse that evidence. Runs before checkout:
      # no code under test sees the token.
      - name: Reuse the merge-train gate of this exact commit
        id: reuse
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/website-'))
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          # The release kit's website-record PR (release/website-*) changes only the release record and
          # release notes, the paths the train treats as evidence-preserving (merge-train/train.mjs
          # isReleaseRecordPath). The kit gates it itself before merging (exact diff set, check:releases,
          # website typecheck/unit/build/e2e), so gating it here only held pool workers lanes needed. A PR
          # that changes, renames or removes anything else gates as usual.
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $record = { param($path) $path -eq 'apps/website/src/data/releases.json' -or ($path -is [string] -and $path.StartsWith('docs/releases/')) }
            try {
              $files = @(); $page = 1
              do {
                $batch = @(Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER/files?per_page=100&page=$page")
                $files += $batch; $page++
              } while ($batch.Count -eq 100 -and $page -le 30)
              $other = @($files | Where-Object { -not (& $record $_.filename) -or ($_.previous_filename -and -not (& $record $_.previous_filename)) })
              if ($files.Count -gt 0 -and $other.Count -eq 0) {
                Write-Output "Release-record PR #$($env:PR_NUMBER): only the release record and notes changed; the release kit gates it."
                Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii -Value 'reused=true'
              }
            } catch {
              Write-Output "::warning::Could not list the PR's files ($($_.Exception.Message)); gating."
            }
            exit 0
          }
          # A trusted gate host: one of the second PC's gate runners (owner, 2026-10-07: all gates there), or a
          # build-PC pool worker for a candidate gated before that move.
          $gateHost = {
            param($j)
            ($j.labels -contains 'self-hosted') -and ($j.labels -contains 'Windows') -and (
              ($j.runner_name -in @('kalcode-win-gate-2', 'kalcode-win-gate-2b') -and ($j.labels -contains 'kalcode-gate-pc2') -and -not ($j.labels -contains 'kalcode-main-pc')) -or
              ($j.runner_name -match '^kalcode-win-gate(-w[1-5])?$' -and ($j.labels -contains 'kalcode-gate') -and ($j.labels -contains 'kalcode-main-pc')))
          }
          try {
            $runs = (Invoke-RestMethod -Headers $headers -Uri "$api/workflows/gate.yml/runs?head_sha=$env:GITHUB_SHA&per_page=20").workflow_runs
            foreach ($run in $runs) {
              if ($run.id -eq [long]$env:GITHUB_RUN_ID -or $run.head_sha -ne $env:GITHUB_SHA -or $run.event -ne 'push' -or
                  $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/gate.yml' -or $run.head_branch -notmatch '^merge-train/[0-9a-f]{12}-[0-9a-f]{8}$') { continue }
              $jobs = (Invoke-RestMethod -Headers $headers -Uri "$api/runs/$($run.id)/jobs?filter=latest&per_page=100").jobs
              # The same evidence the train lands on: a trusted gate host whose Gate step itself ran and passed.
              $green = $jobs | Where-Object {
                $_.name -eq 'Gate (Windows)' -and $_.conclusion -eq 'success' -and $_.head_sha -eq $env:GITHUB_SHA -and
                (& $gateHost $_) -and
                ($_.steps | Where-Object { $_.name -eq 'Gate' -and $_.conclusion -eq 'success' })
              }
              # A split gate also needs the second PC's job green on the same SHA; a legacy run has none.
              $pc2 = @($jobs | Where-Object { $_.name -eq 'Gate (Windows, PC2)' })
              $pc2Green = $pc2.Count -eq 0 -or @($pc2 | Where-Object {
                $_.conclusion -eq 'success' -and $_.head_sha -eq $env:GITHUB_SHA -and $_.runner_name -in @('kalcode-win-gate-2', 'kalcode-win-gate-2b') -and
                ($_.labels -contains 'self-hosted') -and ($_.labels -contains 'Windows') -and ($_.labels -contains 'kalcode-gate-pc2') -and
                -not ($_.labels -contains 'kalcode-main-pc') -and
                ($_.steps | Where-Object { $_.name -eq 'Gate' -and $_.conclusion -eq 'success' })
              }).Count -eq 1
              # A two-job Windows gate also needs its native job green on the same SHA on a trusted gate host.
              $native = @($jobs | Where-Object { $_.name -eq 'Gate (Windows, native)' })
              $nativeGreen = $native.Count -eq 0 -or @($native | Where-Object {
                $_.conclusion -eq 'success' -and $_.head_sha -eq $env:GITHUB_SHA -and
                (& $gateHost $_) -and
                ($_.steps | Where-Object { $_.name -eq 'Gate' -and $_.conclusion -eq 'success' })
              }).Count -eq 1
              if ($green -and $pc2Green -and $nativeGreen) {
                Write-Output "Gate (Windows) already passed for $env:GITHUB_SHA on $($run.head_branch): $($run.html_url)"
                # ASCII: Windows PowerShell's utf8 writes a BOM into an empty file, which corrupts the key.
                Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii -Value 'reused=true'
                exit 0
              }
            }
          } catch {
            Write-Output "::warning::Could not look up merge-train gate evidence ($($_.Exception.Message)); gating."
          }
      # A cancelled or killed earlier job can leave test binaries/rustc running under this worker's
      # _work directory, holding DLLs in the warm target (gate 37362947496 then failed in checkout).
      # Inline because the repository is not checked out yet; same rule as
      # .github/scripts/gate-workspace-hygiene.ps1 -Phase Stop. Own-account processes only.
      - name: Stop this worker's orphaned processes
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $root = ([IO.Path]::GetFullPath((Split-Path -Parent $env:RUNNER_WORKSPACE))).TrimEnd('\') + '\'
          if ($root -notmatch '\\_work\\$') { throw "Refusing to clean outside a runner _work directory: $root" }
          $all = @(Get-CimInstance Win32_Process); $byId = @{}; foreach ($p in $all) { $byId[[int]$p.ProcessId] = $p }
          $keep = @{}; $c = $byId[[int]$PID]; for ($i = 0; $i -lt 16 -and $null -ne $c; $i++) { $keep[[int]$c.ProcessId] = $true; $c = $byId[[int]$c.ParentProcessId] }
          foreach ($p in $all) {
            if ($keep.ContainsKey([int]$p.ProcessId) -or $p.Name -match '^(Runner\.(Worker|Listener)|RunnerService)\.exe$' -or -not $p.ExecutablePath) { continue }
            $cmd = [string]$p.CommandLine
            if ($p.ExecutablePath.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) -or ($cmd -and $cmd.IndexOf($root.TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase) -ge 0)) {
              Write-Output "Stopping orphan $($p.ProcessId) $($p.Name)"; & taskkill.exe /T /F /PID $p.ProcessId 2>&1 | Out-Null
            }
          }
          exit 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          fetch-depth: 0
          # Leave no GitHub token in the checkout for the code under test.
          persist-credentials: false
          # The default clean (git clean -ffdx) wipes the worker's warm Cargo target and fails on files a
          # leftover process holds; the next step resets to the exact SHA and cleans everything else.
          clean: false
      - name: Reset to the exact event SHA, keeping warm caches
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/gate-workspace-hygiene.ps1 -Phase Reset
      - name: Plan change-based gate
        if: steps.reuse.outputs.reused != 'true'
        id: plan
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || inputs.base || 'origin/main~1' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # No build-PC pool hooks here. The second PC has two gate runners; each gets its own fixed port block
          # (pool base + 200, plus 20 for the second runner) so both can gate at once.
          $pc2Slot = switch ($env:RUNNER_NAME) { 'kalcode-win-gate-2' { 0 } 'kalcode-win-gate-2b' { 1 } default { throw 'Unknown second-PC gate worker' } }
          $portOffset = 20 * $pc2Slot
          $head = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -or $head -ne $env:GITHUB_SHA) { throw 'Checkout does not match the immutable event SHA' }
          $base = $env:BASE
          if ($env:GITHUB_REF -like 'refs/heads/merge-train/*') {
            if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF -notmatch '^refs/heads/merge-train/[0-9a-f]{12}-[0-9a-f]{8}$') {
              throw 'Merge-train evidence requires an exact candidate branch push'
            }
            $base = (git log -1 --format='%(trailers:key=Merge-Train-Base,valueonly)' HEAD | Out-String).Trim()
            if ($LASTEXITCODE -or $base -notmatch '^[0-9a-f]{40}$' -or $base -eq $head) {
              throw 'Merge-train candidate has no distinct immutable Merge-Train-Base trailer'
            }
          }
          $base = (git rev-parse --verify "$base^{commit}" | Out-String).Trim()
          if ($LASTEXITCODE -or $base -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve immutable gate base' }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE) { throw 'Gate base is not an ancestor of the candidate' }
          $json = node tooling/release/ship.mjs gate --base $base --list --json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $plan = ($json | Out-String | ConvertFrom-Json).plan
          $selected = @($plan | Where-Object { $_.state -eq 'selected' } | ForEach-Object { $_.id })
          # This job's share of the plan (tooling/release/lifecycle/gate-split.mjs); the jobs above run the rest.
          $only = (node tooling/release/lifecycle/gate-split.mjs pc2 ($selected -join ',') | Out-String).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ids = @($only -split ',' | Where-Object { $_ })
          @(
            "KALCODE_GATE_BASE=$base", "KALCODE_GATE_ONLY=$only",
            "KALCODE_E2E_PORT=$(4691 + $portOffset)", "KALCODE_E2E_MAIL_PORT=$(4692 + $portOffset)",
            "KALCODE_E2E_INSPECTOR_PORT=$(9701 + $portOffset)", "KALCODE_UI_TEST_PORT=$(1791 + $portOffset)",
            "KALCODE_E2E_CDP_PORT=$(39333 + $portOffset)"
          ) | Add-Content -Path $env:GITHUB_ENV -Encoding ascii
          "python=$(([string]($ids -contains 'tooling-unit')).ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii
          "browsers=$(([string](@($ids | Where-Object { $_ -in @('website-e2e','website-checkout-e2e') }).Count -gt 0)).ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii
          Write-Host "Exact candidate $head; base $base; selected checks: $($selected -join ', '); on this PC: $($ids -join ', ')"
      - name: Install
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install selected browser runtime
        if: steps.reuse.outputs.reused != 'true' && (steps.plan.outputs.browsers == 'true')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          pnpm --filter @kalcode/website exec playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # tooling-unit runs the desktop package proof's real SQLite comparison through `python`.
      - name: Prepare portable Python
        id: python
        if: steps.reuse.outputs.reused != 'true' && (steps.plan.outputs.python == 'true')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-desktop-python.ps1
      - name: Gate
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $head = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -or $head -ne $env:GITHUB_SHA) { throw "Checkout does not match the immutable event SHA" }
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          if (-not $env:KALCODE_GATE_ONLY) { Write-Host 'gate: nothing selected for the second PC (the other jobs run the rest)'; exit 0 }
          # Shared with this PC's other gate runner; never alongside its Windows update proof, which has priority.
          . .github/scripts/pc2-machine-lock.ps1
          $lock = Enter-Pc2MachineLock -Mode Shared -TimeoutMinutes 60
          try {
            node tooling/release/ship.mjs gate --base $env:KALCODE_GATE_BASE --only $env:KALCODE_GATE_ONLY --jobs $env:KALCODE_GATE_JOBS --keep-going
            $code = $LASTEXITCODE
          } finally {
            Exit-Pc2MachineLock $lock
          }
          if ($code) { exit $code }
      # A failed Playwright suite keeps its traces and DOM snapshots (retain-on-failure) for diagnosis,
      # on failure only and only while they stay small.
      - name: Measure Playwright failure evidence
        id: playwright_evidence
        if: steps.reuse.outputs.reused != 'true' && failure()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $files = @('apps/desktop/test-results', 'packages/ui/test-results') | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -ErrorAction SilentlyContinue }
          $bytes = [long]($files | Measure-Object -Property Length -Sum).Sum
          $limit = 200MB
          if ($bytes -gt $limit) { Write-Warning "Playwright failure evidence is $([math]::Round($bytes / 1MB)) MB, over the $($limit / 1MB) MB bound; not uploaded" }
          "keep=$(($bytes -gt 0 -and $bytes -le $limit).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Preserve Playwright failure evidence
        if: steps.reuse.outputs.reused != 'true' && failure() && steps.playwright_evidence.outputs.keep == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-playwright-pc2-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results/
            packages/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove this run's portable Python
        if: steps.reuse.outputs.reused != 'true' && (always() && steps.python.outcome != 'skipped' && steps.python.outcome != '')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-desktop-python.ps1 -Cleanup
      - name: Preserve exact candidate evidence
        if: steps.reuse.outputs.reused != 'true' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-evidence-pc2-${{ github.sha }}-${{ github.run_attempt }}
          path: target/gate-evidence.json
          if-no-files-found: ignore
      # Nothing this job started may outlive it.
      - name: Stop processes this job left behind
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path -LiteralPath '.github/scripts/gate-workspace-hygiene.ps1') { .github/scripts/gate-workspace-hygiene.ps1 -Phase Stop }
  macos:
    name: Gate (macOS, Rust)
    # Enabled once the Mac gate runner exists (repository variable KALCODE_MAC_GATE=true).
    if: vars.KALCODE_MAC_GATE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, kalcode-gate]
    # Covers the release-packaging wait below (capped at 120 min) plus the gate itself (120 min).
    timeout-minutes: 240
    steps:
      # Release packaging runs on this same Mac (as kalebcampbell, launchd job
      # com.kalcode.release.package.<sha12>). A gate compile next to it slows the release by tens
      # of minutes, so wait while a release is packaging. Signals, any of which means "packaging":
      #  1. a fresh marker /Users/Shared/KalCode-release/packaging.lock (mtime < 3 h; a stale marker
      #     is ignored), which a release launcher may create at start and remove on exit;
      #  2. a kalebcampbell process whose arguments name the package job, its wrapper
      #     (run-production-macos-package-<sha12>.sh) or the release clone (KalCode-final-*);
      #  3. kalebcampbell cargo/rustc processes. macOS hides other users' process arguments from a
      #     non-root account, so (2) may not match from kalcodeci; process names stay visible.
      # The wait is capped at 120 min, then the gate proceeds. This step never fails the job.
      - name: Wait while a release is packaging on this Mac
        shell: bash
        run: |
          marker=/Users/Shared/KalCode-release/packaging.lock
          release_user=kalebcampbell
          budget=$((120 * 60)); poll=60; log_every=300; fresh=$((3 * 60 * 60))
          packaging_reason() {
            if [ -f "$marker" ]; then
              mtime=$(stat -f %m "$marker" 2>/dev/null || echo 0)
              age=$(( $(date +%s) - mtime ))
              if [ "$age" -ge 0 ] && [ "$age" -lt "$fresh" ]; then
                echo "marker $marker (age ${age}s)"; return 0
              fi
            fi
            pids=$(pgrep -u "$release_user" -f 'com\.kalcode\.release\.package|run-production-macos-package-|KalCode-final-' 2>/dev/null | xargs)
            if [ -n "$pids" ]; then echo "release package processes of $release_user: $pids"; return 0; fi
            pids=$(pgrep -u "$release_user" -x 'cargo|rustc' 2>/dev/null | xargs)
            if [ -n "$pids" ]; then echo "cargo/rustc of $release_user: $pids"; return 0; fi
            return 1
          }
          waited=0; last_log=-$log_every
          while reason=$(packaging_reason); do
            if [ "$waited" -ge "$budget" ]; then
              echo "::warning::Release still packaging after $((waited / 60)) min ($reason); running the gate anyway."
              exit 0
            fi
            if [ $((waited - last_log)) -ge "$log_every" ]; then
              echo "$(date -u +%H:%M:%SZ) release packaging on this Mac: $reason; gate waiting (${waited}s of ${budget}s)."
              last_log=$waited
            fi
            sleep "$poll"; waited=$((waited + poll))
          done
          echo "No release packaging in the way after ${waited}s; running the gate."
          exit 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Same preparation as ci.yml's macOS Rust job.
      - name: Frontend placeholder for tauri::generate_context
        shell: bash
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - name: Select isolated Dev identity for Rust debug gates
        shell: bash
        run: node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_ENV, "TAURI_CONFIG=" + JSON.stringify(JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.dev.conf.json", "utf8"))) + "\n");'
      - name: Prepare production speech build tools
        shell: bash
        run: |
          set -euo pipefail
          tool_root=/Users/Shared/KalCode-gate-tools
          cmake_version_dir="$tool_root/cmake-4.4.3-macos-universal"
          cmake_dir="$cmake_version_dir/CMake.app/Contents/bin"
          for tool_path in "$tool_root" "$cmake_version_dir" "$cmake_version_dir/CMake.app" "$cmake_version_dir/CMake.app/Contents" "$cmake_dir" "$cmake_dir/cmake"; do
            test ! -L "$tool_path"
            test ! -w "$tool_path"
          done
          test -x "$cmake_dir/cmake"
          cmake_version="$("$cmake_dir/cmake" --version)"
          test "${cmake_version%%$'\n'*}" = "cmake version 4.4.3"
          printf '%s\n' "$cmake_dir" >> "$GITHUB_PATH"
          printf 'CMAKE=%s/cmake\n' "$cmake_dir" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { macSdkBuildEnvironment } from "./tooling/release/macos-contract.mjs";
          const sdk = execFileSync("xcrun", ["--show-sdk-path"], { encoding: "utf8" });
          for (const [key, value] of Object.entries(macSdkBuildEnvironment({}, sdk))) {
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - name: Build real macOS Tauri sidecars for Rust gates
        shell: bash
        run: |
          set -euo pipefail
          export TAURI_CONFIG="$(node -e 'const config = JSON.parse(process.env.TAURI_CONFIG); config.bundle = { externalBin: [] }; process.stdout.write(JSON.stringify(config));')"
          host_target="$(rustc -vV | awk '/^host: / { print $2 }')"
          cargo build --locked --target "$host_target" -p kalcode-update-helper --bin kalcode-update-helper
          cargo build --locked --target "$host_target" -p kalcode-providers --bin kalcode-provider-guardian
          cargo build --locked --target "$host_target" -p kalcode-hook-bridge --bin kalcode-hook --no-default-features
          helper_dir="apps/desktop/src-tauri/binaries"
          mkdir -p "$helper_dir"
          for helper in kalcode-update-helper kalcode-provider-guardian kalcode-hook; do
            install -m 755 "target/$host_target/debug/$helper" "$helper_dir/$helper-$host_target"
          done
      # The gate account runs without a login session, so it has no login Keychain. Give it its
      # own Keychain (test entries only, never a real secret) so the OS credential-store test
      # still exercises the real Keychain.
      - name: Gate account Keychain
        shell: bash
        run: |
          set -euo pipefail
          kc="$HOME/Library/Keychains/kalcode-gate.keychain-db"
          [ -f "$kc" ] || security create-keychain -p kalcode-gate "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
          security unlock-keychain -p kalcode-gate "$kc"
          security set-keychain-settings "$kc"
      - run: cargo clippy --workspace --all-targets --features kalcode-desktop/kalvoice-whisper -- -D warnings
      - run: cargo test --workspace --features kalcode-desktop/kalvoice-whisper
