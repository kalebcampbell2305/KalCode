name: Gate (self-hosted)

# The repository's gate (`ship.mjs gate`) on KalCode's own machines, so merging never depends on
# GitHub-hosted minutes. The runners are the low-privilege gate accounts described in
# tooling/runners/README.md: they hold no signing, publishing or GitHub credentials.

on:
  push:
    branches: [main]
  pull_request:
    # Docs-only PRs skip the self-hosted gate (AGENTS.md parallel merge protocol): the two gate
    # runners are the merge bottleneck. Later patterns win; release notes still gate.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!marketing/**"
      - "docs/releases/**"
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Dedicated ports, so a gate never collides with an agent session on the same PC.
  KALCODE_E2E_PORT: "4491"
  KALCODE_E2E_MAIL_PORT: "4492"
  KALCODE_E2E_INSPECTOR_PORT: "9501"
  KALCODE_UI_TEST_PORT: "1591"

jobs:
  windows:
    name: Gate (Windows)
    # Never run code from a fork on our machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, kalcode-gate]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Leave no GitHub token in the checkout for the code under test.
          persist-credentials: false
      - name: Install
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @kalcode/desktop exec playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @kalcode/website exec playwright install chromium
      - name: Gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before) || 'origin/main~1' }}
          # API tests spawn Wrangler/workerd children; bound their fan-out on the shared PC.
          VITEST_MAX_WORKERS: "4"
        # Release tooling expects Cargo's default target/ (checkout-local; the runner keeps it).
        run: |
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          node tooling/release/ship.mjs gate --base $env:BASE

  macos:
    name: Gate (macOS, Rust)
    # Enabled once the Mac gate runner exists (repository variable KALCODE_MAC_GATE=true).
    if: vars.KALCODE_MAC_GATE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, kalcode-gate]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Same preparation as ci.yml's macOS Rust job.
      - name: Frontend placeholder for tauri::generate_context
        shell: bash
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - name: Select isolated Dev identity for Rust debug gates
        shell: bash
        run: node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_ENV, "TAURI_CONFIG=" + JSON.stringify(JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.dev.conf.json", "utf8"))) + "\n");'
      - name: Prepare production speech build tools
        shell: bash
        run: |
          set -euo pipefail
          tool_root=/Users/Shared/KalCode-gate-tools
          cmake_version_dir="$tool_root/cmake-4.4.3-macos-universal"
          cmake_dir="$cmake_version_dir/CMake.app/Contents/bin"
          for tool_path in "$tool_root" "$cmake_version_dir" "$cmake_version_dir/CMake.app" "$cmake_version_dir/CMake.app/Contents" "$cmake_dir" "$cmake_dir/cmake"; do
            test ! -L "$tool_path"
            test ! -w "$tool_path"
          done
          test -x "$cmake_dir/cmake"
          cmake_version="$("$cmake_dir/cmake" --version)"
          test "${cmake_version%%$'\n'*}" = "cmake version 4.4.3"
          printf '%s\n' "$cmake_dir" >> "$GITHUB_PATH"
          printf 'CMAKE=%s/cmake\n' "$cmake_dir" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { macSdkBuildEnvironment } from "./tooling/release/macos-contract.mjs";
          const sdk = execFileSync("xcrun", ["--show-sdk-path"], { encoding: "utf8" });
          for (const [key, value] of Object.entries(macSdkBuildEnvironment({}, sdk))) {
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - name: Build real macOS Tauri sidecars for Rust gates
        shell: bash
        run: |
          set -euo pipefail
          export TAURI_CONFIG="$(node -e 'const config = JSON.parse(process.env.TAURI_CONFIG); config.bundle = { externalBin: [] }; process.stdout.write(JSON.stringify(config));')"
          host_target="$(rustc -vV | awk '/^host: / { print $2 }')"
          cargo build --locked --target "$host_target" -p kalcode-desktop --bin kalcode-update-helper
          cargo build --locked --target "$host_target" -p kalcode-providers --bin kalcode-provider-guardian
          cargo build --locked --target "$host_target" -p kalcode-hook-bridge --bin kalcode-hook --no-default-features
          helper_dir="apps/desktop/src-tauri/binaries"
          mkdir -p "$helper_dir"
          for helper in kalcode-update-helper kalcode-provider-guardian kalcode-hook; do
            install -m 755 "target/$host_target/debug/$helper" "$helper_dir/$helper-$host_target"
          done
      # The gate account runs without a login session, so it has no login Keychain. Give it its
      # own Keychain (test entries only, never a real secret) so the OS credential-store test
      # still exercises the real Keychain.
      - name: Gate account Keychain
        shell: bash
        run: |
          set -euo pipefail
          kc="$HOME/Library/Keychains/kalcode-gate.keychain-db"
          [ -f "$kc" ] || security create-keychain -p kalcode-gate "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
          security unlock-keychain -p kalcode-gate "$kc"
          security set-keychain-settings "$kc"
      - run: cargo clippy --workspace --all-targets --features kalcode-desktop/kalvoice-whisper -- -D warnings
      - run: cargo test --workspace --features kalcode-desktop/kalvoice-whisper
