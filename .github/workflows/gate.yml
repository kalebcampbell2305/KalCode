name: Gate (self-hosted)

# The repository's gate (`ship.mjs gate`) on KalCode's own machines, so merging never depends on
# GitHub-hosted minutes. The runners are the low-privilege gate accounts described in
# tooling/runners/README.md: they hold no signing, publishing or GitHub credentials.

on:
  push:
    # Gate the exact immutable candidate before the train updates main.
    branches: [main, "merge-train/**"]
  pull_request:
    # Docs-only PRs skip the self-hosted gate. Later patterns win; release notes still gate.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!marketing/**"
      - "docs/releases/**"
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Read-only: lets a push to main find the merge-train gate that already passed for the same commit.
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Gate ports are per gate worker: see "Assign this gate worker's ports" below.

jobs:
  windows:
    name: Gate (Windows)
    # Never run code from a fork on our machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Owner policy: validate on the main 64 GB Windows PC, never the second PC. The label is served by the
    # gate worker pool on that PC (AGENTS.md parallel gate worker pool rule; tooling/runners/README.md).
    runs-on: [self-hosted, Windows, kalcode-gate]
    # 150 min for the gate plus up to 45 min queued for a heavy-gate token (Gate step).
    timeout-minutes: 195
    steps:
      # A merge-train landing fast-forwards main to a candidate this job already gated. Re-gating the
      # identical commit would only occupy the gate runner, so reuse that evidence. Runs before checkout:
      # no code under test sees the token.
      - name: Reuse the merge-train gate of this exact commit
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          try {
            $runs = (Invoke-RestMethod -Headers $headers -Uri "$api/workflows/gate.yml/runs?head_sha=$env:GITHUB_SHA&per_page=20").workflow_runs
            foreach ($run in $runs) {
              if ($run.id -eq [long]$env:GITHUB_RUN_ID -or $run.head_sha -ne $env:GITHUB_SHA -or $run.event -ne 'push' -or
                  $run.path -ne '.github/workflows/gate.yml' -or $run.head_branch -notmatch '^merge-train/[0-9a-f]{12}-[0-9a-f]{8}$') { continue }
              $jobs = (Invoke-RestMethod -Headers $headers -Uri "$api/runs/$($run.id)/jobs").jobs
              # The same evidence the train lands on: a main-PC pool worker whose Gate step itself ran and passed.
              $green = $jobs | Where-Object {
                $_.name -eq 'Gate (Windows)' -and $_.conclusion -eq 'success' -and $_.head_sha -eq $env:GITHUB_SHA -and
                $_.runner_name -match '^kalcode-win-gate(-w[1-9])?$' -and
                ($_.steps | Where-Object { $_.name -eq 'Gate' -and $_.conclusion -eq 'success' })
              }
              if ($green) {
                Write-Output "Gate (Windows) already passed for $env:GITHUB_SHA on $($run.head_branch): $($run.html_url)"
                # ASCII: Windows PowerShell's utf8 writes a BOM into an empty file, which corrupts the key.
                Add-Content -Path $env:GITHUB_OUTPUT -Encoding ascii -Value 'reused=true'
                exit 0
              }
            }
          } catch {
            Write-Output "::warning::Could not look up merge-train gate evidence ($($_.Exception.Message)); gating."
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          fetch-depth: 0
          # Leave no GitHub token in the checkout for the code under test.
          persist-credentials: false
      # Several gate workers share the build PC (tooling/runners/README.md, gate worker pool): each runner's
      # .env sets KALCODE_GATE_SLOT, and every port a gate opens moves by 10 x slot, so concurrent gates never
      # collide with each other or with an agent session's ports. Slots 0-9 are distinct.
      - name: Assign this gate worker's ports
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $slot = 0
          if ($env:KALCODE_GATE_SLOT) { $slot = [int]$env:KALCODE_GATE_SLOT }
          if ($slot -lt 0 -or $slot -gt 9) { throw "KALCODE_GATE_SLOT must be 0-9, not $slot" }
          $o = 10 * $slot
          Add-Content -Path $env:GITHUB_ENV -Encoding ascii -Value @(
            "KALCODE_GATE_PORT_OFFSET=$o"
            "KALCODE_E2E_PORT=$(4491 + $o)"
            "KALCODE_E2E_MAIL_PORT=$(4492 + $o)"
            "KALCODE_E2E_INSPECTOR_PORT=$(9501 + $o)"
            "KALCODE_UI_TEST_PORT=$(1591 + $o)"
            "KALCODE_E2E_CDP_PORT=$(9601 + $o)"
          )
          Write-Output "gate worker $($env:RUNNER_NAME): slot $slot, port offset $o"
      - name: Install
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @kalcode/desktop exec playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @kalcode/website exec playwright install chromium
      # tooling-unit runs the desktop package proof's real SQLite comparison through `python`.
      # The gate machine has no system Python, so use the same pinned, signature-checked
      # portable runtime the desktop QA workflows use, scoped to this run.
      - name: Prepare portable Python
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-desktop-python.ps1
      # build:e2e compiles kalvoice-whisper: whisper-rs-sys needs CMake and libclang (bindgen),
      # which the gate machine lacks. Pinned, hash-checked official archives, scoped to this run.
      - name: Prepare portable CMake and libclang
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-portable-cmake.ps1
      - name: Gate
        if: steps.reuse.outputs.reused != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || 'origin/main~1' }}
          # API tests spawn Wrangler/workerd children; bound their fan-out on the shared PC.
          VITEST_MAX_WORKERS: "4"
        # Release tooling expects Cargo's default target/ (checkout-local; the runner keeps it).
        run: |
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          # The main PC's gate worker pool: kalcode-win-gate and its workers -w1..-w9, never the second PC.
          if ($env:RUNNER_NAME -notmatch '^kalcode-win-gate(-w[1-9])?$') { throw "Gate must run on the owner's main Windows PC" }
          $head = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -or $head -ne $env:GITHUB_SHA) { throw "Checkout does not match the immutable event SHA" }
          $base = $env:BASE
          $extra = @()
          if ($env:GITHUB_REF -like 'refs/heads/merge-train/*') {
            if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF -notmatch '^refs/heads/merge-train/[0-9a-f]{12}-[0-9a-f]{8}$') {
              throw "Merge-train evidence requires an exact candidate branch push"
            }
            # New branches have no meaningful event.before. Gate every change since the main
            # snapshot recorded in the candidate, never a moving origin/main reference.
            $base = (git log -1 --format='%(trailers:key=Merge-Train-Base,valueonly)' HEAD | Out-String).Trim()
            if ($LASTEXITCODE -or $base -notmatch '^[0-9a-f]{40}$' -or $base -eq $head) {
              throw "Merge-train candidate has no distinct immutable Merge-Train-Base trailer"
            }
            git merge-base --is-ancestor $base HEAD
            if ($LASTEXITCODE) { throw "Merge-Train-Base $base is not an ancestor of the candidate" }
            $extra = @('--keep-going')
          }
          # The build PC also runs the owner's KalCode and coding agents: the gate and everything it starts run
          # below normal priority (Windows children inherit it), so user work always wins the CPU.
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          # Heavy gates (Rust builds) take one of KALCODE_GATE_HEAVY_SLOTS machine-wide tokens and start only with
          # KALCODE_GATE_MIN_FREE_GB of free memory, so six workers never build Rust at once and starve the PC.
          # Light gates never wait. The token is this process's open lock file: it is released when the step
          # ends, however it ends. After 45 min the gate runs anyway rather than never.
          $token = $null
          try {
            $plan = (node tooling/release/ship.mjs gate --base $base --list --json | Out-String) | ConvertFrom-Json
            $heavy = @($plan.plan | Where-Object { $_.state -eq 'selected' -and $_.id -in 'rust', 'desktop-native-e2e' }).Count -gt 0
          } catch {
            $heavy = $true # the gate itself reports a broken plan; queue as heavy meanwhile
          }
          if ($heavy -and $env:KALCODE_GATE_LOCK_DIR) {
            $slots = 3
            if ($env:KALCODE_GATE_HEAVY_SLOTS) { $slots = [int]$env:KALCODE_GATE_HEAVY_SLOTS }
            $minFreeGb = 10
            if ($env:KALCODE_GATE_MIN_FREE_GB) { $minFreeGb = [int]$env:KALCODE_GATE_MIN_FREE_GB }
            New-Item -ItemType Directory -Force -Path $env:KALCODE_GATE_LOCK_DIR | Out-Null
            $deadline = (Get-Date).AddMinutes(45)
            for (;;) {
              $freeGb = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
              if ($freeGb -ge $minFreeGb) {
                foreach ($i in 1..$slots) {
                  try {
                    $token = [IO.File]::Open((Join-Path $env:KALCODE_GATE_LOCK_DIR "heavy-$i.lock"), 'OpenOrCreate', 'ReadWrite', 'None')
                    Write-Output "heavy-gate token $i of $slots taken ($freeGb GB free)"
                    break
                  } catch { }
                }
              }
              if ($token) { break }
              if ((Get-Date) -gt $deadline) {
                Write-Output "::warning::No heavy-gate token after 45 min ($freeGb GB free, $slots tokens); gating anyway."
                break
              }
              Write-Output "$(Get-Date -Format HH:mm:ss) waiting for a heavy-gate token ($freeGb GB free of $minFreeGb GB needed, $slots tokens)"
              Start-Sleep -Seconds 30
            }
          }
          node tooling/release/ship.mjs gate --base $base @extra
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Remove this run's portable Python
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-desktop-python.ps1 -Cleanup
      - name: Remove this run's portable CMake and libclang
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .github/scripts/prepare-portable-cmake.ps1 -Cleanup

  macos:
    name: Gate (macOS, Rust)
    # Enabled once the Mac gate runner exists (repository variable KALCODE_MAC_GATE=true).
    if: vars.KALCODE_MAC_GATE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, kalcode-gate]
    # Covers the release-packaging wait below (capped at 120 min) plus the gate itself (120 min).
    timeout-minutes: 240
    steps:
      # Release packaging runs on this same Mac (as kalebcampbell, launchd job
      # com.kalcode.release.package.<sha12>). A gate compile next to it slows the release by tens
      # of minutes, so wait while a release is packaging. Signals, any of which means "packaging":
      #  1. a fresh marker /Users/Shared/KalCode-release/packaging.lock (mtime < 3 h; a stale marker
      #     is ignored), which a release launcher may create at start and remove on exit;
      #  2. a kalebcampbell process whose arguments name the package job, its wrapper
      #     (run-production-macos-package-<sha12>.sh) or the release clone (KalCode-final-*);
      #  3. kalebcampbell cargo/rustc processes. macOS hides other users' process arguments from a
      #     non-root account, so (2) may not match from kalcodeci; process names stay visible.
      # The wait is capped at 120 min, then the gate proceeds. This step never fails the job.
      - name: Wait while a release is packaging on this Mac
        shell: bash
        run: |
          marker=/Users/Shared/KalCode-release/packaging.lock
          release_user=kalebcampbell
          budget=$((120 * 60)); poll=60; log_every=300; fresh=$((3 * 60 * 60))
          packaging_reason() {
            if [ -f "$marker" ]; then
              mtime=$(stat -f %m "$marker" 2>/dev/null || echo 0)
              age=$(( $(date +%s) - mtime ))
              if [ "$age" -ge 0 ] && [ "$age" -lt "$fresh" ]; then
                echo "marker $marker (age ${age}s)"; return 0
              fi
            fi
            pids=$(pgrep -u "$release_user" -f 'com\.kalcode\.release\.package|run-production-macos-package-|KalCode-final-' 2>/dev/null | xargs)
            if [ -n "$pids" ]; then echo "release package processes of $release_user: $pids"; return 0; fi
            pids=$(pgrep -u "$release_user" -x 'cargo|rustc' 2>/dev/null | xargs)
            if [ -n "$pids" ]; then echo "cargo/rustc of $release_user: $pids"; return 0; fi
            return 1
          }
          waited=0; last_log=-$log_every
          while reason=$(packaging_reason); do
            if [ "$waited" -ge "$budget" ]; then
              echo "::warning::Release still packaging after $((waited / 60)) min ($reason); running the gate anyway."
              exit 0
            fi
            if [ $((waited - last_log)) -ge "$log_every" ]; then
              echo "$(date -u +%H:%M:%SZ) release packaging on this Mac: $reason; gate waiting (${waited}s of ${budget}s)."
              last_log=$waited
            fi
            sleep "$poll"; waited=$((waited + poll))
          done
          echo "No release packaging in the way after ${waited}s; running the gate."
          exit 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Same preparation as ci.yml's macOS Rust job.
      - name: Frontend placeholder for tauri::generate_context
        shell: bash
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - name: Select isolated Dev identity for Rust debug gates
        shell: bash
        run: node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_ENV, "TAURI_CONFIG=" + JSON.stringify(JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.dev.conf.json", "utf8"))) + "\n");'
      - name: Prepare production speech build tools
        shell: bash
        run: |
          set -euo pipefail
          tool_root=/Users/Shared/KalCode-gate-tools
          cmake_version_dir="$tool_root/cmake-4.4.3-macos-universal"
          cmake_dir="$cmake_version_dir/CMake.app/Contents/bin"
          for tool_path in "$tool_root" "$cmake_version_dir" "$cmake_version_dir/CMake.app" "$cmake_version_dir/CMake.app/Contents" "$cmake_dir" "$cmake_dir/cmake"; do
            test ! -L "$tool_path"
            test ! -w "$tool_path"
          done
          test -x "$cmake_dir/cmake"
          cmake_version="$("$cmake_dir/cmake" --version)"
          test "${cmake_version%%$'\n'*}" = "cmake version 4.4.3"
          printf '%s\n' "$cmake_dir" >> "$GITHUB_PATH"
          printf 'CMAKE=%s/cmake\n' "$cmake_dir" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { macSdkBuildEnvironment } from "./tooling/release/macos-contract.mjs";
          const sdk = execFileSync("xcrun", ["--show-sdk-path"], { encoding: "utf8" });
          for (const [key, value] of Object.entries(macSdkBuildEnvironment({}, sdk))) {
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - name: Build real macOS Tauri sidecars for Rust gates
        shell: bash
        run: |
          set -euo pipefail
          export TAURI_CONFIG="$(node -e 'const config = JSON.parse(process.env.TAURI_CONFIG); config.bundle = { externalBin: [] }; process.stdout.write(JSON.stringify(config));')"
          host_target="$(rustc -vV | awk '/^host: / { print $2 }')"
          cargo build --locked --target "$host_target" -p kalcode-desktop --bin kalcode-update-helper
          cargo build --locked --target "$host_target" -p kalcode-providers --bin kalcode-provider-guardian
          cargo build --locked --target "$host_target" -p kalcode-hook-bridge --bin kalcode-hook --no-default-features
          helper_dir="apps/desktop/src-tauri/binaries"
          mkdir -p "$helper_dir"
          for helper in kalcode-update-helper kalcode-provider-guardian kalcode-hook; do
            install -m 755 "target/$host_target/debug/$helper" "$helper_dir/$helper-$host_target"
          done
      # The gate account runs without a login session, so it has no login Keychain. Give it its
      # own Keychain (test entries only, never a real secret) so the OS credential-store test
      # still exercises the real Keychain.
      - name: Gate account Keychain
        shell: bash
        run: |
          set -euo pipefail
          kc="$HOME/Library/Keychains/kalcode-gate.keychain-db"
          [ -f "$kc" ] || security create-keychain -p kalcode-gate "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
          security unlock-keychain -p kalcode-gate "$kc"
          security set-keychain-settings "$kc"
      - run: cargo clippy --workspace --all-targets --features kalcode-desktop/kalvoice-whisper -- -D warnings
      - run: cargo test --workspace --features kalcode-desktop/kalvoice-whisper
