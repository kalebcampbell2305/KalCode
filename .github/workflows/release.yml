name: Release (self-hosted)

# After a merge to main, run the release pipeline's automated phases on the guarded release runner
# (tooling/runners/README.md). The runner's pre-job hook refuses anything but this workflow from main.
# The pipeline stops at every approval, attestation, operator step and named production write; after a
# person records one (`ship.mjs approve|attest ... --state <dir>`), resume with `gh workflow run release.yml`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release jobs run in parallel, one per commit (AGENTS.md multi-shipper rule). Only the final D1
# stable-pointer write is serialized, by its forward-only compare-and-set in publish.mjs.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  warm:
    name: Warm the Windows release tree
    # Keeps <owner repo>/.worktrees/release-warm-windows compiled at the newest main so the release build after a merge is
    # incremental (docs/release/FAST-PIPELINE.md). Off until the repository variable KALCODE_RELEASE_WARM=true, and
    # KALCODE_RELEASE_REPO names the owner's checkout on the release machine. It signs and publishes nothing.
    if: github.ref == 'refs/heads/main' && vars.KALCODE_RELEASE_WARM == 'true' && vars.KALCODE_RELEASE_REPO != ''
    runs-on: [self-hosted, Windows, kalcode-release]
    # One shared warm worktree, so warm runs (not releases) stay serialized.
    concurrency:
      group: release-warm
      cancel-in-progress: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Warm
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          KALCODE_RELEASE_REPO: ${{ vars.KALCODE_RELEASE_REPO }}
        run: |
          $timings = Join-Path $env:LOCALAPPDATA 'KalCode\release-pipeline'
          node tooling/release/warm-release-tree.mjs --repo $env:KALCODE_RELEASE_REPO --commit $env:GITHUB_SHA --timings-root $timings
          exit $LASTEXITCODE

  release:
    name: Release (automated phases)
    # Off until the release lane hands over (repository variable KALCODE_AUTO_RELEASE=true), so it can
    # never start a second pipeline beside a release someone is already running by hand. It runs after the
    # warm pass (or without it when warming is off or failed), so the release build starts from a warm tree.
    needs: warm
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.KALCODE_AUTO_RELEASE == 'true' }}
    runs-on: [self-hosted, Windows, kalcode-release]
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: pnpm install --frozen-lockfile
      - name: Release
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:KALCODE_RELEASE_STATE_ROOT = Join-Path $env:LOCALAPPDATA 'KalCode\release-pipeline'
          node tooling/release/release-on-merge.mjs
          exit $LASTEXITCODE
