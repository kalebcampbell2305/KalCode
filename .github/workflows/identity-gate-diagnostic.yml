name: Identity gate diagnostic

on:
  push:
    branches:
      - ops/identity-gate-diagnostic

permissions:
  contents: read

jobs:
  metrics:
    name: Read-only PC2 resource telemetry
    runs-on: [self-hosted, Windows, kalcode-gate-pc2]
    timeout-minutes: 3
    steps:
      - name: Read bounded host metrics
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'

          $os = Get-CimInstance Win32_OperatingSystem
          $processors = @(Get-CimInstance Win32_Processor)
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          $tracked = @(
            Get-CimInstance Win32_Process -Filter "Name='rustc.exe' OR Name='cargo.exe' OR Name='link.exe' OR Name='node.exe' OR Name='workerd.exe'"
          )
          $processGroups = @(
            $tracked |
              Group-Object Name |
              Sort-Object Name |
              ForEach-Object {
                $workingSet = ($_.Group | Measure-Object -Property WorkingSetSize -Sum).Sum
                $kernel = ($_.Group | Measure-Object -Property KernelModeTime -Sum).Sum
                $user = ($_.Group | Measure-Object -Property UserModeTime -Sum).Sum
                [pscustomobject]@{
                  name = $_.Name.ToLowerInvariant()
                  count = $_.Count
                  workingSetMiB = [math]::Round(([double]$workingSet / 1MB), 1)
                  cpuSeconds = [math]::Round((([double]$kernel + [double]$user) / 10000000), 1)
                }
              }
          )

          $gateReports = @()
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          if (Test-Path -LiteralPath $target -PathType Container) {
            $gateReports = @(
              Get-ChildItem -LiteralPath $target -File -Filter 'gate*' -ErrorAction SilentlyContinue |
                Where-Object { $_.Extension -in @('.json', '.log', '.txt') } |
                Sort-Object LastWriteTimeUtc -Descending |
                Select-Object -First 25 |
                ForEach-Object {
                  [pscustomobject]@{
                    name = $_.Name
                    bytes = $_.Length
                    lastWriteUtc = $_.LastWriteTimeUtc.ToString('o')
                  }
                }
            )
          }

          $toolRoot = 'C:\ProgramData\KalCodeGatePool\tools\cargo\bin'
          $toolPresence = @(
            foreach ($tool in @(
              @{ command = 'cargo-deny'; file = 'cargo-deny.exe' },
              @{ command = 'cargo-audit'; file = 'cargo-audit.exe' }
            )) {
              $resolved = Get-Command $tool.command -ErrorAction SilentlyContinue | Select-Object -First 1
              $canonical = Join-Path $toolRoot $tool.file
              $canonicalExists = Test-Path -LiteralPath $canonical -PathType Leaf
              $canonicalVersion = $null
              if ($canonicalExists) {
                $canonicalVersion = (& $canonical '--version' 2>&1 | Select-Object -First 1 | Out-String).Trim()
              }
              [pscustomobject]@{
                command = $tool.command
                resolvedOnPath = $null -ne $resolved
                resolvedSource = if ($null -ne $resolved) { $resolved.Source } else { $null }
                canonicalExists = $canonicalExists
                canonicalVersion = $canonicalVersion
              }
            }
          )

          $lockAcl = @(
            foreach ($path in @(
              'C:\ProgramData\KalCodePC2\locks',
              'C:\ProgramData\KalCodePC2\locks\browser.lock',
              'C:\ProgramData\KalCodePC2\locks\rust.lock',
              'C:\ProgramData\KalCodePC2\locks\gate.lock',
              'C:\ProgramData\KalCodePC2\locks\qa-intent.lock'
            )) {
              if (-not (Test-Path -LiteralPath $path)) {
                [pscustomobject]@{ path = $path; exists = $false; owner = $null; protected = $null; access = @() }
                continue
              }
              try {
                $acl = Get-Acl -LiteralPath $path
                [pscustomobject]@{
                  path = $path
                  exists = $true
                  owner = $acl.Owner
                  protected = $acl.AreAccessRulesProtected
                  access = @(
                    $acl.Access | ForEach-Object {
                      [pscustomobject]@{
                        identity = $_.IdentityReference.Value
                        rights = $_.FileSystemRights.ToString()
                        type = $_.AccessControlType.ToString()
                        inherited = $_.IsInherited
                        inheritance = $_.InheritanceFlags.ToString()
                        propagation = $_.PropagationFlags.ToString()
                      }
                    }
                  )
                }
              } catch {
                [pscustomobject]@{ path = $path; exists = $true; owner = $null; protected = $null; access = @(); readError = $_.Exception.Message }
              }
            }
          )

          $runnerService = Get-CimInstance Win32_Service -Filter "Name LIKE 'actions.runner.%$($env:RUNNER_NAME)'" -ErrorAction SilentlyContinue | Select-Object -First 1

          $payload = [pscustomobject]@{
            schema = 'kalcode-pc2-readonly-telemetry/v1'
            observedAtUtc = [DateTime]::UtcNow.ToString('o')
            runner = $env:RUNNER_NAME
            memory = [pscustomobject]@{
              freeMiB = [math]::Round(([double]$os.FreePhysicalMemory / 1KB), 1)
              totalMiB = [math]::Round(([double]$os.TotalVisibleMemorySize / 1KB), 1)
              freePercent = [math]::Round((100 * [double]$os.FreePhysicalMemory / [double]$os.TotalVisibleMemorySize), 1)
            }
            cpu = [pscustomobject]@{
              loadPercent = if ($processors.Count) { [math]::Round((($processors | Measure-Object -Property LoadPercentage -Average).Average), 1) } else { $null }
              logicalProcessors = [int](($processors | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum)
            }
            diskC = [pscustomobject]@{
              freeGiB = [math]::Round(([double]$disk.FreeSpace / 1GB), 2)
              totalGiB = [math]::Round(([double]$disk.Size / 1GB), 2)
            }
            trackedProcesses = $processGroups
            gateReportMetadata = $gateReports
            runnerServiceAccount = if ($null -ne $runnerService) { $runnerService.StartName } else { $null }
            toolPresence = $toolPresence
            lockAcl = $lockAcl
          }
          $payload | ConvertTo-Json -Depth 6 -Compress
