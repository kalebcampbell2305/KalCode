name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. Superseded PR runs are cancelled; runs on main always finish, so every
# merged commit gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only helps local rebuilds; in CI it bloats the cache.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Headless Linux runners have no Secret Service daemon for the keychain round-trip test.
      KALCODE_SKIP_OS_KEYCHAIN_TEST: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux system libraries for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Only main writes caches; PRs restore them. Keeps the 10 GB cache budget for main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Frontend placeholder for tauri::generate_context
        shell: bash
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - name: Build real macOS Tauri sidecars for Rust gates
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | awk '/^host: / { print $2 }')"
          case "$host_target" in
            aarch64-apple-darwin|x86_64-apple-darwin) ;;
            *) echo "Unsupported macOS host target: $host_target" >&2; exit 1 ;;
          esac

          cargo build --locked --target "$host_target" -p kalcode-desktop --bin kalcode-update-helper
          cargo build --locked --target "$host_target" -p kalcode-providers --bin kalcode-provider-guardian
          cargo build --locked --target "$host_target" -p kalcode-hook-bridge --bin kalcode-hook --no-default-features

          helper_dir="apps/desktop/src-tauri/binaries"
          mkdir -p "$helper_dir"
          for helper in kalcode-update-helper kalcode-provider-guardian kalcode-hook; do
            source="target/$host_target/debug/$helper"
            destination="$helper_dir/$helper-$host_target"
            test -f "$source" && test -x "$source"
            install -m 755 "$source" "$destination"
            test -f "$destination" && test -x "$destination"
          done
      - run: cargo fmt --all -- --check
      - name: Diagnostic strict Clippy across independent targets
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Protocol types are up to date
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          node tooling/gen-protocol-index.mjs
          git diff --exit-code -- packages/protocol/src/generated
