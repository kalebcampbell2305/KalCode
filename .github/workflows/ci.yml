name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. Superseded PR runs are cancelled; runs on main always finish, so every
# merged commit gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only helps local rebuilds; in CI it bloats the cache.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Headless Linux runners have no Secret Service daemon for the keychain round-trip test.
      KALCODE_SKIP_OS_KEYCHAIN_TEST: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reclaim unused Linux hosted SDK space
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
            echo "Refusing SDK cleanup outside a GitHub-hosted runner." >&2
            exit 1
          fi

          readonly workspace_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          readonly home_root="$(realpath -e -- "$HOME")"
          readonly -a sdk_roots=(
            /usr/local/lib/android
            /usr/share/dotnet
          )
          protected_roots=(
            "$workspace_root"
            "$home_root"
            /opt/hostedtoolcache
            /usr/local/bin
            /usr/bin
            /usr/lib
            /usr/include
            /lib
            /lib64
          )
          for variable in RUNNER_TOOL_CACHE CARGO_HOME RUSTUP_HOME NVM_DIR; do
            value="${!variable:-}"
            if [[ -n "$value" ]]; then
              protected_roots+=("$(realpath -m -- "$value")")
            fi
          done
          readonly -a protected_roots

          echo "Disk space before hosted SDK cleanup:"
          df -h /
          available_before="$(df -B1 --output=avail / | awk 'NR == 2 { print $1 }')"
          [[ "$available_before" =~ ^[0-9]+$ ]]

          removed_count=0
          for sdk_root in "${sdk_roots[@]}"; do
            case "$sdk_root" in
              /usr/local/lib/android|/usr/share/dotnet) ;;
              *) echo "Refusing non-allowlisted SDK root: $sdk_root" >&2; exit 1 ;;
            esac

            if [[ -L "$sdk_root" ]]; then
              echo "Refusing symlinked SDK root: $sdk_root" >&2
              exit 1
            fi
            if [[ ! -e "$sdk_root" ]]; then
              echo "Hosted SDK root already absent; skipping: $sdk_root"
              continue
            fi
            if [[ ! -d "$sdk_root" ]]; then
              echo "Refusing non-directory SDK root: $sdk_root" >&2
              exit 1
            fi

            resolved="$(realpath -e -- "$sdk_root")"
            if [[ "$resolved" != "$sdk_root" ]]; then
              echo "Refusing redirected SDK root: $sdk_root" >&2
              exit 1
            fi
            for protected_root in "${protected_roots[@]}"; do
              if [[ "$resolved" == "$protected_root" || "$resolved" == "$protected_root"/* || "$protected_root" == "$resolved"/* ]]; then
                echo "Refusing protected SDK root: $sdk_root" >&2
                exit 1
              fi
            done

            echo "Reclaiming documented hosted SDK root: $sdk_root"
            sudo rm -rf --one-file-system -- "$resolved"
            if [[ -e "$resolved" || -L "$resolved" ]]; then
              echo "Hosted SDK root remains after cleanup: $sdk_root" >&2
              exit 1
            fi
            removed_count=$((removed_count + 1))
          done

          available_after="$(df -B1 --output=avail / | awk 'NR == 2 { print $1 }')"
          [[ "$available_after" =~ ^[0-9]+$ ]]
          if (( removed_count > 0 && available_after <= available_before )); then
            echo "Hosted SDK cleanup did not increase available disk space." >&2
            exit 1
          fi
          echo "Disk space after hosted SDK cleanup:"
          df -h /
          echo "Reclaimed available bytes: $((available_after - available_before))"
      - name: Linux system libraries for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Only main writes caches; PRs restore them. Keeps the 10 GB cache budget for main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Frontend placeholder for tauri::generate_context
        shell: bash
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - name: Build real macOS Tauri sidecars for Rust gates
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | awk '/^host: / { print $2 }')"
          case "$host_target" in
            aarch64-apple-darwin|x86_64-apple-darwin) ;;
            *) echo "Unsupported macOS host target: $host_target" >&2; exit 1 ;;
          esac

          cargo build --locked --target "$host_target" -p kalcode-desktop --bin kalcode-update-helper
          cargo build --locked --target "$host_target" -p kalcode-providers --bin kalcode-provider-guardian
          cargo build --locked --target "$host_target" -p kalcode-hook-bridge --bin kalcode-hook --no-default-features

          helper_dir="apps/desktop/src-tauri/binaries"
          mkdir -p "$helper_dir"
          for helper in kalcode-update-helper kalcode-provider-guardian kalcode-hook; do
            source="target/$host_target/debug/$helper"
            destination="$helper_dir/$helper-$host_target"
            test -f "$source" && test -x "$source"
            install -m 755 "$source" "$destination"
            test -f "$destination" && test -x "$destination"
          done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Diagnostic complete workspace test inventory
        run: cargo test --workspace --no-fail-fast
      - run: cargo test --workspace
      - name: Protocol types are up to date
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          node tooling/gen-protocol-index.mjs
          git diff --exit-code -- packages/protocol/src/generated
