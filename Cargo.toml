[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
# Fixed internal crate version. KalCode's public version lives in apps/desktop/src-tauri/tauri.conf.json
# (with apps/desktop/package.json) and is compiled only into the app crate, so changing it never
# recompiles the workspace crates. Do not bump this for a release.
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "LicenseRef-KalCode-Proprietary"
authors = ["KalCode"]
repository = "https://kalcoded.com"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[patch.crates-io]
portable-pty = { path = "third_party/portable-pty" }
# tao 0.35.3 + upstream c704261c (Windows reentrant input-lock deadlock); see third_party/tao/KALCODE_PATCH.md.
tao = { path = "third_party/tao" }

[workspace.lints.rust]
# `deny`, not `forbid`: exactly one audited call site (apps/desktop/src-tauri/src/main.rs)
# opts in, to strip browser-runtime overrides from the environment before any thread starts.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
